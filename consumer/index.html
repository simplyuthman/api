<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Market — Live Listings</title>
  <meta name="description" content="Browse property listings powered by the live Property Market API." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & tokens ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --accent-hi: #8b85ff;
      --text: #e8eaf0;
      --muted: #8b8fa8;
      --danger: #ff5c72;
      --success: #34d399;
      --radius: 12px;
      --transition: 0.2s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header span {
      font-size: 0.75rem;
      background: var(--accent);
      color: #fff;
      padding: 0.2em 0.6em;
      border-radius: 999px;
      font-weight: 600;
    }

    /* ── Controls bar ── */
    #controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 2rem;
      flex-wrap: wrap;
    }

    #controls label {
      font-size: 0.875rem;
      color: var(--muted);
    }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color var(--transition);
    }

    select:hover,
    select:focus {
      border-color: var(--accent);
      outline: none;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background var(--transition), opacity var(--transition);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btn-prev,
    #btn-next {
      background: var(--accent);
      color: #fff;
    }

    #btn-prev:not(:disabled):hover,
    #btn-next:not(:disabled):hover {
      background: var(--accent-hi);
    }

    #page-info {
      font-size: 0.8125rem;
      color: var(--muted);
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      padding: 0 2rem 2rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color var(--transition), transform var(--transition);
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-address {
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .card-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    .badge {
      font-size: 0.75rem;
      background: #2a2d3a;
      color: var(--muted);
      padding: 0.2em 0.55em;
      border-radius: 6px;
    }

    .card-price {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--success);
      margin-top: auto;
      padding-top: 0.75rem;
    }

    /* ── State messages ── */
    #state-message {
      display: none;
      padding: 3rem 2rem;
      text-align: center;
    }

    #state-message.visible {
      display: block;
    }

    #state-icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }

    #state-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    #state-body {
      font-size: 0.875rem;
      color: var(--muted);
      max-width: 380px;
      margin: 0 auto;
    }

    #state-message.error #state-title {
      color: var(--danger);
    }

    /* ── Skeleton loader ── */
    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .skel-line {
      background: linear-gradient(90deg, var(--border) 25%, #2f3344 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🏡 Property Market</h1>
    <span>LIVE</span>
  </header>

  <div id="controls">
    <label for="city-filter">Filter by city</label>
    <select id="city-filter">
      <option value="">All cities</option>
      <option>Austin</option>
      <option>Denver</option>
      <option>Seattle</option>
      <option>Atlanta</option>
      <option>Chicago</option>
      <option>Boston</option>
      <option>Phoenix</option>
      <option>Miami</option>
      <option>Dallas</option>
      <option>San Francisco</option>
    </select>

    <button id="btn-prev" disabled>← Prev</button>
    <span id="page-info"></span>
    <button id="btn-next" disabled>Next →</button>
  </div>

  <main>
    <div id="grid" aria-live="polite" aria-label="Listings grid"></div>
    <div id="state-message" role="status" aria-live="polite">
      <div id="state-icon"></div>
      <div id="state-title"></div>
      <div id="state-body"></div>
    </div>
  </main>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // CONFIG — point at the deployed Railway URL. Never use localhost. (PRD §5.5)
    // ─────────────────────────────────────────────────────────────────────────
    const API_BASE_URL = 'https://api-production-70d9.up.railway.app/api/v1';

    const LIMIT = 20;

    // ── State ──
    let offset = 0;
    let currentCity = '';
    let currentTotal = 0;

    // ── DOM refs ──
    const grid = document.getElementById('grid');
    const stateMsg = document.getElementById('state-message');
    const stateIcon = document.getElementById('state-icon');
    const stateTitle = document.getElementById('state-title');
    const stateBody = document.getElementById('state-body');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const pageInfo = document.getElementById('page-info');
    const cityFilter = document.getElementById('city-filter');

    // ── Helpers ──

    function formatPrice(priceMinor, currency) {
      const major = priceMinor / 100;
      return new Intl.NumberFormat('en-US', { style: 'currency', currency, maximumFractionDigits: 0 }).format(major);
    }

    function showSkeletons() {
      grid.innerHTML = Array.from({ length: 6 }).map(() => `
        <div class="skeleton">
          <div class="skel-line" style="height:1rem;width:70%"></div>
          <div class="skel-line" style="height:0.75rem;width:50%"></div>
          <div class="skel-line" style="height:0.75rem;width:35%"></div>
          <div class="skel-line" style="height:1rem;width:40%;margin-top:0.5rem"></div>
        </div>
      `).join('');
      hideState();
    }

    function showState(type, icon, title, body) {
      grid.innerHTML = '';
      stateIcon.textContent = icon;
      stateTitle.textContent = title;
      stateBody.textContent = body;
      stateMsg.className = `visible ${type}`;
    }

    function hideState() {
      stateMsg.className = '';
    }

    function renderCards(listings) {
      grid.innerHTML = listings.map(l => `
        <article class="card">
          <div class="card-title">${escHtml(l.title)}</div>
          <div class="card-address">${escHtml(l.address)}, ${escHtml(l.city)}</div>
          <div class="card-badges">
            <span class="badge">${l.bedrooms} bed</span>
            <span class="badge">${l.bathrooms} bath</span>
            <span class="badge">${l.squareMeters} m²</span>
          </div>
          <div class="card-price">${formatPrice(l.priceMinor, l.currency)}</div>
        </article>
      `).join('');
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updatePagination(meta) {
      currentTotal = meta.total;
      const page = Math.floor(offset / LIMIT) + 1;
      const totalPages = Math.ceil(meta.total / LIMIT) || 1;
      pageInfo.textContent = `Page ${page} of ${totalPages} (${meta.total} listings)`;
      btnPrev.disabled = offset === 0;
      btnNext.disabled = !meta.hasMore;
    }

    // ── Fetch ──

    async function fetchListings() {
      showSkeletons();
      btnPrev.disabled = true;
      btnNext.disabled = true;

      const params = new URLSearchParams({ limit: LIMIT, offset });
      if (currentCity) params.set('city', currentCity);

      try {
        const res = await fetch(`${API_BASE_URL}/listings?${params}`);

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          const code = body?.error?.code ?? res.status;
          showState('error', '⚠️', `API Error (${code})`, body?.error?.message ?? 'The server returned an unexpected response.');
          return;
        }

        const { data, meta } = await res.json();

        if (data.length === 0) {
          showState('', '🔍', 'No listings found', currentCity
            ? `There are no listings in ${currentCity}. Try a different city.`
            : 'No listings match your current filters.');
          pageInfo.textContent = '';
          return;
        }

        hideState();
        renderCards(data);
        updatePagination(meta);

      } catch (err) {
        showState('error', '🚫', 'Could not reach the API', 'Check your internet connection or try again later.');
      }
    }

    // ── Event listeners ──

    cityFilter.addEventListener('change', () => {
      currentCity = cityFilter.value;
      offset = 0;
      fetchListings();
    });

    btnPrev.addEventListener('click', () => {
      offset = Math.max(0, offset - LIMIT);
      fetchListings();
    });

    btnNext.addEventListener('click', () => {
      offset += LIMIT;
      fetchListings();
    });

    // ── Init ──
    fetchListings();
  </script>
</body>

</html>
